name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SmartBudget.xcodeproj -scheme SmartBudget -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmartBudget.app Payload/
          zip -r SmartBudget-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartBudget-IPA
          path: SmartBudget-unsigned.ipa
